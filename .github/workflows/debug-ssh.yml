name: Debug SSH Connection

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check secrets are set
        run: |
          echo "EC2_HOST is set: ${{ secrets.EC2_HOST != '' }}"
          echo "EC2_USER is set: ${{ secrets.EC2_USER != '' }}"
          echo "EC2_SSH_KEY is set: ${{ secrets.EC2_SSH_KEY != '' }}"
          echo "EC2_HOST value: ${{ secrets.EC2_HOST }}"
          echo "EC2_USER value: ${{ secrets.EC2_USER }}"
          echo "EC2_SSH_KEY length: ${#EC2_SSH_KEY}"
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 Host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts || echo "Failed to add host to known_hosts"

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          ssh -vvv -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo 'SSH works!' && whoami" || echo "SSH connection failed"

